<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Farewise · Every way from A to B, priced</title>
    <meta name="description" content="Compare walking, cycling, public transit, taxis and driving between any two places in the world, plan a day of stops around fixed times, and track what getting around costs you. Free, no sign-up." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply the saved theme before first paint (no flash); src/lib/theme.ts takes over after load
      try { var t = localStorage.getItem('farewise-theme'); var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.classList.toggle('dark', d); document.documentElement.style.colorScheme = d ? 'dark' : 'light' } catch (e) {}
    </script>
    <link rel="preconnect" href="https://api.transitous.org" crossorigin />
    <link rel="preconnect" href="https://routing.openstreetmap.de" crossorigin />
    <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <meta property="og:title" content="Farewise" />
    <meta property="og:description" content="Every way from A to B, priced. Walking, cycling, transit, taxis and driving compared for any trip in the world." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://advk2k4.github.io/farewise/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8'/%3E%3Cpath d='M9 19.5h7.5a3.25 3.25 0 0 0 0-6.5h-5a3.25 3.25 0 0 1 0-6.5H19' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='19.5' r='2' fill='%23fff'/%3E%3Crect x='17.5' y='5' width='3.5' height='3.5' rx='.8' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <noscript>Farewise needs JavaScript to look up routes.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
